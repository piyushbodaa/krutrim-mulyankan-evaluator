[project]
name = "kritrim-mulyankan"
version = "0.6.1"
description = "Kritrim Mulyankan: a local CLI to test and compare AI models, benchmarks, harnesses and personal agents."
readme = "README.md"
license = "MIT"
authors = [{ name = "Krutrim Mulyankan contributors" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "openai>=3.29.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
km = "kritrim_mulyankan.cli:app"
mj = "kritrim_mulyankan.cli:app"  # old name, kept as an alias

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["research"]  # Preserve imported research bundles byte-for-byte.

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
