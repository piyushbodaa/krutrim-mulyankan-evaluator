name: Desktop installers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Check and test
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest

  installers:
    name: Unsigned ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
          - os: macos-15
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native Rust tests
        run: cargo test --locked --manifest-path km-rs/Cargo.toml
      - name: Build the Rust engine
        shell: bash
        run: |
          # The desktop engine is the Rust km-desktop binary, built from the
          # same evaluator crate as the km CLI (km-rs/). No Python is bundled.
          cargo build --locked --release --manifest-path km-rs/Cargo.toml -p km-desktop-engine -p km-cli
          mkdir -p desktop/src-tauri/resources/engine/desktop/ui
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp km-rs/target/release/km-desktop.exe desktop/src-tauri/resources/engine/km-desktop.exe
          else
            cp km-rs/target/release/km-desktop desktop/src-tauri/resources/engine/km-desktop
            chmod +x desktop/src-tauri/resources/engine/km-desktop
          fi
          cp -a preview desktop/src-tauri/resources/engine/preview
          cp -a suites desktop/src-tauri/resources/engine/suites
          cp desktop/ui/dashboard-shim.js desktop/src-tauri/resources/engine/desktop/ui/dashboard-shim.js
      - name: Build portable Linux CLI
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y musl-tools
          cargo build --locked --release --manifest-path km-rs/Cargo.toml -p km-cli --target x86_64-unknown-linux-musl
      - name: Smoke test native binaries and package CLI
        run: python scripts/package_native.py ${{ matrix.platform }}
      - name: Build the unsigned installer
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          if [ "$RUNNER_OS" = "Linux" ]; then
            npm run build -- --bundles appimage,deb
          elif [ "$RUNNER_OS" = "Windows" ]; then
            npm run build -- --bundles nsis,msi
          else
            npm run build -- --bundles dmg
          fi
      - name: Portable Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          app=$(echo desktop/src-tauri/target/release/bundle/appimage/*.AppImage)
          chmod +x "$app"
          rm -rf /tmp/km-appimage
          mkdir -p /tmp/km-appimage
          (cd /tmp/km-appimage && "$GITHUB_WORKSPACE/$app" --appimage-extract)
          tar -C /tmp/km-appimage/squashfs-root -czf \
            desktop/src-tauri/target/release/bundle/appimage/km-desktop-linux.tar.gz .
      - name: Collect stable installer filenames
        run: python scripts/package_native.py ${{ matrix.platform }} --installers
      - name: Upload native downloads
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          if-no-files-found: error
          path: dist/native/*
