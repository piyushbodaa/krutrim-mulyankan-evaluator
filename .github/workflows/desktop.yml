name: Desktop installers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Check and test
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest

  installers:
    name: Unsigned ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Linux
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config
      - name: Bundle the Python engine
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install .
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; STRIP=""; else SEP=":"; STRIP="--strip"; fi
          # Same slimming as release.yml; pygments is desktop-only safe to
          # drop because the bridge never imports the Typer/rich CLI.
          python -m PyInstaller --noconfirm --clean --onefile $STRIP --name km-desktop \
            --collect-all kritrim_mulyankan \
            --add-data "suites${SEP}suites" \
            --add-data "preview${SEP}preview" \
            --add-data "desktop/ui/dashboard-shim.js${SEP}desktop/ui" \
            --exclude-module tkinter --exclude-module _tkinter \
            --exclude-module test --exclude-module unittest \
            --exclude-module pydoc --exclude-module pydoc_data \
            --exclude-module lib2to3 --exclude-module setuptools \
            --exclude-module pygments \
            desktop/sidecar/entry.py
          mkdir -p desktop/src-tauri/resources/engine
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/km-desktop.exe desktop/src-tauri/resources/engine/km-desktop.exe
          else
            cp dist/km-desktop desktop/src-tauri/resources/engine/km-desktop
            chmod +x desktop/src-tauri/resources/engine/km-desktop
          fi
      - name: Build the unsigned installer
        working-directory: desktop
        shell: bash
        run: |
          npm install
          if [ "$RUNNER_OS" = "Linux" ]; then
            npm run build -- --bundles appimage,deb
          elif [ "$RUNNER_OS" = "Windows" ]; then
            npm run build -- --bundles nsis,msi
          else
            npm run build -- --bundles dmg
          fi
      - name: Portable Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          app=$(echo desktop/src-tauri/target/release/bundle/appimage/*.AppImage)
          chmod +x "$app"
          rm -rf /tmp/km-appimage
          mkdir -p /tmp/km-appimage
          (cd /tmp/km-appimage && "$GITHUB_WORKSPACE/$app" --appimage-extract)
          tar -C /tmp/km-appimage/squashfs-root -czf \
            desktop/src-tauri/target/release/bundle/appimage/km-desktop-linux.tar.gz .
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: km-desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.tar.gz
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
