name: Desktop installers

on:
  pull_request:
  push:
    branches: [main]
  # Build every download without creating a release or changing the version.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Engine tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Check and test
        run: |
          uv sync --locked --group dev
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked pytest

  downloads:
    name: CLI and desktop downloads
    needs: test
    uses: ./.github/workflows/build-downloads.yml
