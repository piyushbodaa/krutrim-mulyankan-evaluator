name: Rust km

on:
  pull_request:
    paths:
      - ".cargo/**"
      - "km-rs/**"
      - "suites/**"
      - "tests/test_rust_parity.py"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - ".cargo/**"
      - "km-rs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-parity:
    name: Rust tests + Python parity (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy, rustfmt
      - name: Format and clippy (zero warnings)
        run: |
          cargo fmt --manifest-path km-rs/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path km-rs/Cargo.toml --all-targets -- -D warnings
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Rust unit tests
        run: cargo test --locked --manifest-path km-rs/Cargo.toml
      - name: Build the static km and desktop engine
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo build --locked --release --manifest-path km-rs/Cargo.toml -p km-cli --target x86_64-unknown-linux-musl
          cargo build --locked --release --manifest-path km-rs/Cargo.toml -p km-desktop-engine
          ls -lh km-rs/target/x86_64-unknown-linux-musl/release/km km-rs/target/release/km-desktop
          python3 scripts/bench.py km-rs/target/x86_64-unknown-linux-musl/release/km
      - name: Parity tests (Python vs Rust on the bundled suites)
        env:
          KM_RUST_BIN: ${{ github.workspace }}/km-rs/target/x86_64-unknown-linux-musl/release/km
          KM_RUST_DESKTOP_BIN: ${{ github.workspace }}/km-rs/target/release/km-desktop
        run: |
          uv sync --locked --group dev
          uv run --locked pytest tests/test_rust_parity.py -v
