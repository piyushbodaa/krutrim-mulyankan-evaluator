# Pushing a tag v<version> publishes download assets. The tag version must match
# pyproject.toml (v0.1.1 -> kritrim_mulyankan-0.1.1-py3-none-any.whl).
# This file does not create tags. Assets are unsigned; see desktop/SIGNING.md.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Check version, lint, and test
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$tag" = "$ver"
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest

  wheel:
    name: Python wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          ver="${GITHUB_REF_NAME#v}"
          uv build --wheel
          test -f "dist/kritrim_mulyankan-${ver}-py3-none-any.whl"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          if-no-files-found: error
          path: dist/kritrim_mulyankan-*.whl

  cli:
    name: Linux km binary
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build single-file km with suites packed in
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install .
          # --strip plus excluding unused stdlib/tooling modules keeps the
          # single file smaller (locally 27.8 MB -> 23.5 MB). pygments stays:
          # Typer's rich help imports it (verified by running the built file).
          python -m PyInstaller --noconfirm --clean --onefile --strip --name km \
            --collect-all kritrim_mulyankan \
            --add-data "suites:suites" \
            --exclude-module tkinter --exclude-module _tkinter \
            --exclude-module test --exclude-module unittest \
            --exclude-module pydoc --exclude-module pydoc_data \
            --exclude-module lib2to3 --exclude-module setuptools \
            desktop/sidecar/km_entry.py
          ./dist/km --help >/dev/null
          mkdir -p dist/km-linux/suites
          cp dist/km dist/km-linux/km
          chmod +x dist/km-linux/km
          cp -a suites/. dist/km-linux/suites/
          tar -C dist/km-linux -czf km-linux-x86_64.tar.gz km suites
      - uses: actions/upload-artifact@v4
        with:
          name: km-linux
          if-no-files-found: error
          path: km-linux-x86_64.tar.gz

  desktop:
    name: Linux desktop
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config
      - name: Bundle the Python engine
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install .
          # The engine is the largest thing we control inside the AppImage
          # (the rest is WebKitGTK, which the .deb gets from the system).
          # pygments is excluded here only: the desktop bridge never imports
          # the Typer/rich CLI (verified with a ping/catalog/run check).
          python -m PyInstaller --noconfirm --clean --onefile --strip --name km-desktop \
            --collect-all kritrim_mulyankan \
            --add-data "suites:suites" \
            --add-data "preview:preview" \
            --add-data "desktop/ui/dashboard-shim.js:desktop/ui" \
            --exclude-module tkinter --exclude-module _tkinter \
            --exclude-module test --exclude-module unittest \
            --exclude-module pydoc --exclude-module pydoc_data \
            --exclude-module lib2to3 --exclude-module setuptools \
            --exclude-module pygments \
            desktop/sidecar/entry.py
          printf '%s\n' '{"id":"ci","method":"ping","params":{}}' | ./dist/km-desktop | grep -q '"ok": true'
          mkdir -p desktop/src-tauri/resources/engine
          cp dist/km-desktop desktop/src-tauri/resources/engine/km-desktop
          chmod +x desktop/src-tauri/resources/engine/km-desktop
      - name: Build the unsigned installer
        working-directory: desktop
        shell: bash
        run: |
          npm install
          npm run build -- --bundles appimage,deb
      - name: Rename to the download filename
        shell: bash
        run: |
          built=$(echo desktop/src-tauri/target/release/bundle/appimage/*.AppImage)
          test -f "$built"
          cp "$built" Krutrim-Mulyankan-linux.AppImage
          chmod +x Krutrim-Mulyankan-linux.AppImage
          built_deb=$(echo desktop/src-tauri/target/release/bundle/deb/*.deb)
          test -f "$built_deb"
          cp "$built_deb" Krutrim-Mulyankan-linux.deb
          ls -lh Krutrim-Mulyankan-linux.AppImage Krutrim-Mulyankan-linux.deb
      - uses: actions/upload-artifact@v4
        with:
          name: Krutrim-Mulyankan-linux.AppImage
          if-no-files-found: error
          path: Krutrim-Mulyankan-linux.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: Krutrim-Mulyankan-linux.deb
          if-no-files-found: error
          path: Krutrim-Mulyankan-linux.deb

  publish:
    name: GitHub Release
    needs: [wheel, cli, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Require the website filenames
        run: |
          ver="${GITHUB_REF_NAME#v}"
          test -f release/Krutrim-Mulyankan-linux.AppImage
          test -f release/Krutrim-Mulyankan-linux.deb
          test -f "release/kritrim_mulyankan-${ver}-py3-none-any.whl"
          test -f release/km-linux-x86_64.tar.gz
          find release -type f -printf '%f\n' | sort > /tmp/release-names.txt
          cat /tmp/release-names.txt
          test "$(wc -l < /tmp/release-names.txt)" -eq 4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/Krutrim-Mulyankan-linux.AppImage
            release/Krutrim-Mulyankan-linux.deb
            release/kritrim_mulyankan-*.whl
            release/km-linux-x86_64.tar.gz
          body: |
            Linux only for now. Unsigned builds. Signing is a later step.

            - Krutrim-Mulyankan-linux.AppImage — desktop app, no terminal required
            - Krutrim-Mulyankan-linux.deb — desktop app for Debian/Ubuntu (double-click to install; uses the system WebKitGTK, so it is much smaller)
            - kritrim_mulyankan-<version>-py3-none-any.whl
            - km-linux-x86_64.tar.gz — single-file `km`, with `suites/` beside it and packed inside

            Unvalidated pilot. Not a ranking.
