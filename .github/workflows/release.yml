# A new version merged to main, or an explicit v<version> tag, publishes downloads
# only after the same native builds as desktop CI. Existing main versions skip.
# Assets have no publisher signature/notarization; see desktop/SIGNING.md.
name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - .github/workflows/release.yml
      - pyproject.toml
      - km-rs/Cargo.toml
      - desktop/package.json
      - desktop/src-tauri/Cargo.toml
      - desktop/src-tauri/tauri.conf.json

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Decide whether this version needs a release
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate versions and check the remote tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TESTED_COMMIT: ${{ github.sha }}
        run: python scripts/package_downloads.py prepare-release --ref-type "$REF_TYPE" --ref-name "$REF_NAME" --commit "$TESTED_COMMIT"

  test:
    name: Tests
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Lint and test
        run: |
          uv sync --locked --group dev
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked pytest

  wheel:
    name: Python wheel
    needs: [prepare, test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          uv build --wheel
          test -f "dist/kritrim_mulyankan-${RELEASE_VERSION}-py3-none-any.whl"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          if-no-files-found: error
          path: dist/kritrim_mulyankan-*.whl

  downloads:
    name: CLI and desktop downloads
    needs: test
    uses: ./.github/workflows/build-downloads.yml
    with:
      sign-updates: true
    secrets: inherit

  publish:
    name: GitHub Release
    needs: [prepare, wheel, downloads]
    runs-on: ubuntu-22.04
    concurrency:
      group: release-publish-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Write the update manifest for installed apps
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python scripts/package_downloads.py update-manifest --directory release --version "$RELEASE_VERSION" --tag "$RELEASE_TAG"
      - name: Verify the complete download set and write checksums
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/package_downloads.py verify-release --directory release --version "$RELEASE_VERSION"
      - name: Refuse a tag that moved while the builds ran
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TESTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: python scripts/package_downloads.py guard-release-tag --tag "$RELEASE_TAG" --commit "$TESTED_COMMIT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Sign the checksums the km CLI verifies before updating itself
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
          npm ci --prefix desktop
          desktop/node_modules/.bin/tauri signer sign release/SHA256SUMS
          test -s release/SHA256SUMS.sig
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/Krutrim-Mulyankan-linux.AppImage
            release/Krutrim-Mulyankan-linux.deb
            release/Krutrim-Mulyankan-linux.rpm
            release/Krutrim-Mulyankan-linux.pkg.tar.zst
            release/Krutrim-Mulyankan-linux-setup.tar.gz
            release/km-desktop-linux.tar.gz
            release/Krutrim-Mulyankan-windows.exe
            release/Krutrim-Mulyankan-mac-arm64.dmg
            release/Krutrim-Mulyankan-mac-x86_64.dmg
            release/km-linux-x86_64.tar.gz
            release/km-windows-x86_64.zip
            release/km-macos-aarch64.tar.gz
            release/km-macos-x86_64.tar.gz
            release/Krutrim-Mulyankan-mac-arm64.app.tar.gz
            release/Krutrim-Mulyankan-mac-x86_64.app.tar.gz
            release/latest.json
            release/kritrim_mulyankan-*.whl
            release/SHA256SUMS
            release/SHA256SUMS.sig
          body: |
            Desktop app and standalone Rust CLI for Linux x86_64, Windows x86_64,
            and macOS (Apple Silicon and Intel). Each package is built and its
            evaluation engine smoke-tested on a native runner before publication.

            Desktop: Linux AppImage, Debian/Ubuntu DEB, Fedora/openSUSE RPM,
            Arch/Omarchy package, portable Linux tar.gz,
            Windows installer, and separate Apple Silicon / Intel macOS DMGs.
            Linux setup: extract Krutrim-Mulyankan-linux-setup.tar.gz, then open
            Install Krutrim Mulyankan. It adds the app to your user account and
            application menu without a terminal or administrator password.
            CLI: extract the matching km-<platform>-<architecture> archive;
            the executable and bundled suites are included. Python users can
            install the platform-independent wheel.

            Builds have no publisher signature or Apple notarization. macOS
            bundles use ad-hoc signing. See desktop/SIGNING.md for installation
            guidance. SHA256SUMS covers every download.

            Automatic updates: installed apps (AppImage, Windows, macOS, .deb,
            .rpm) and the km CLI check this release, verify its signature
            (latest.json, SHA256SUMS.sig) and update themselves.

            Unvalidated pilot. Not a ranking.
