# Pushing a tag v<version> publishes download assets. The tag version must match
# pyproject.toml (v0.2.0 -> kritrim_mulyankan-0.2.0-py3-none-any.whl).
# This file does not create tags. Assets are unsigned; see desktop/SIGNING.md.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Check version, lint, and test
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$tag" = "$ver"
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest

  wheel:
    name: Python wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          ver="${GITHUB_REF_NAME#v}"
          uv build --wheel
          test -f "dist/kritrim_mulyankan-${ver}-py3-none-any.whl"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          if-no-files-found: error
          path: dist/kritrim_mulyankan-*.whl

  cli:
    name: Linux km binary
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Build the static Rust km (suites also packed inside)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo build --release --manifest-path km-rs/Cargo.toml -p km-cli --target x86_64-unknown-linux-musl
          bin=km-rs/target/x86_64-unknown-linux-musl/release/km
          file "$bin"
          "$bin" --help >/dev/null
          mkdir -p /tmp/km-smoke
          (cd /tmp/km-smoke && "$GITHUB_WORKSPACE/$bin" run example -r oracle -r echo >/dev/null)
          mkdir -p dist/km-linux/suites
          cp "$bin" dist/km-linux/km
          chmod +x dist/km-linux/km
          cp -a suites/. dist/km-linux/suites/
          tar -C dist/km-linux -czf km-linux-x86_64.tar.gz km suites
          ls -lh km-linux-x86_64.tar.gz dist/km-linux/km
      - uses: actions/upload-artifact@v4
        with:
          name: km-linux
          if-no-files-found: error
          path: km-linux-x86_64.tar.gz

  desktop:
    name: Linux desktop
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config
      - name: Build the Rust engine
        shell: bash
        run: |
          # The desktop engine is the Rust km-desktop binary, built from the
          # same evaluator crate as the km CLI (km-rs/). No Python is bundled.
          cargo build --release --manifest-path km-rs/Cargo.toml -p km-desktop-engine
          mkdir -p desktop/src-tauri/resources/engine/desktop/ui
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp km-rs/target/release/km-desktop.exe desktop/src-tauri/resources/engine/km-desktop.exe
          else
            cp km-rs/target/release/km-desktop desktop/src-tauri/resources/engine/km-desktop
            chmod +x desktop/src-tauri/resources/engine/km-desktop
          fi
          cp -a preview desktop/src-tauri/resources/engine/preview
          cp -a suites desktop/src-tauri/resources/engine/suites
          cp desktop/ui/dashboard-shim.js desktop/src-tauri/resources/engine/desktop/ui/dashboard-shim.js
          printf '%s\n' '{"id":"ci","method":"ping","params":{}}' | desktop/src-tauri/resources/engine/km-desktop | grep -q '"ok":true'
      - name: Build the unsigned installer
        working-directory: desktop
        shell: bash
        run: |
          npm install
          npm run build -- --bundles appimage,deb
      - name: Rename to the download filename
        shell: bash
        run: |
          built=$(echo desktop/src-tauri/target/release/bundle/appimage/*.AppImage)
          test -f "$built"
          cp "$built" Krutrim-Mulyankan-linux.AppImage
          chmod +x Krutrim-Mulyankan-linux.AppImage
          built_deb=$(echo desktop/src-tauri/target/release/bundle/deb/*.deb)
          test -f "$built_deb"
          cp "$built_deb" Krutrim-Mulyankan-linux.deb
          ls -lh Krutrim-Mulyankan-linux.AppImage Krutrim-Mulyankan-linux.deb
      - uses: actions/upload-artifact@v4
        with:
          name: Krutrim-Mulyankan-linux.AppImage
          if-no-files-found: error
          path: Krutrim-Mulyankan-linux.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: Krutrim-Mulyankan-linux.deb
          if-no-files-found: error
          path: Krutrim-Mulyankan-linux.deb

  publish:
    name: GitHub Release
    needs: [wheel, cli, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Require the website filenames
        run: |
          ver="${GITHUB_REF_NAME#v}"
          test -f release/Krutrim-Mulyankan-linux.AppImage
          test -f release/Krutrim-Mulyankan-linux.deb
          test -f "release/kritrim_mulyankan-${ver}-py3-none-any.whl"
          test -f release/km-linux-x86_64.tar.gz
          find release -type f -printf '%f\n' | sort > /tmp/release-names.txt
          cat /tmp/release-names.txt
          test "$(wc -l < /tmp/release-names.txt)" -eq 4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/Krutrim-Mulyankan-linux.AppImage
            release/Krutrim-Mulyankan-linux.deb
            release/kritrim_mulyankan-*.whl
            release/km-linux-x86_64.tar.gz
          body: |
            Linux only for now. Unsigned builds. Signing is a later step.

            - Krutrim-Mulyankan-linux.AppImage — desktop app, no terminal required
            - Krutrim-Mulyankan-linux.deb — desktop app for Debian/Ubuntu (double-click to install; uses the system WebKitGTK, so it is much smaller)
            - kritrim_mulyankan-<version>-py3-none-any.whl
            - km-linux-x86_64.tar.gz — static Rust `km`, with `suites/` beside it and packed inside

            Unvalidated pilot. Not a ranking.
