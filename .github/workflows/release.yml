# Pushing a tag v<version> publishes download assets. The tag version must match
# pyproject.toml (v0.2.0 -> kritrim_mulyankan-0.2.0-py3-none-any.whl).
# This file does not create tags. Assets are unsigned; see desktop/SIGNING.md.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Check version, lint, and test
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$tag" = "$ver"
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest

  wheel:
    name: Python wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          ver="${GITHUB_REF_NAME#v}"
          uv build --wheel
          test -f "dist/kritrim_mulyankan-${ver}-py3-none-any.whl"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          if-no-files-found: error
          path: dist/kritrim_mulyankan-*.whl

  native:
    needs: test
    uses: ./.github/workflows/desktop.yml

  publish:
    name: GitHub Release
    needs: [wheel, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Require the website filenames
        run: |
          ver="${GITHUB_REF_NAME#v}"
          test -f release/Krutrim-Mulyankan-linux.AppImage
          test -f release/Krutrim-Mulyankan-linux.deb
          test -f "release/kritrim_mulyankan-${ver}-py3-none-any.whl"
          test -f release/km-linux-x86_64.tar.gz
          test -f release/km-windows-x86_64.zip
          test -f release/km-macos-aarch64.tar.gz
          test -f release/km-macos-x86_64.tar.gz
          test -f release/Krutrim-Mulyankan-windows-x86_64.exe
          test -f release/Krutrim-Mulyankan-windows-x86_64.msi
          test -f release/Krutrim-Mulyankan-macos-aarch64.dmg
          test -f release/Krutrim-Mulyankan-macos-x86_64.dmg
          find release -type f -printf '%f\n' | sort > /tmp/release-names.txt
          cat /tmp/release-names.txt
          test "$(wc -l < /tmp/release-names.txt)" -eq 11
      - name: Generate release checksums
        run: (cd release && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: release/*
          body: |
            Native Linux, Windows x64, Apple Silicon and Intel Mac builds.
            Unsigned Windows installers; macOS builds are ad-hoc signed, not notarized.
            These builds are not yet suitable for warning-free public installation.
            See desktop/SIGNING.md for signing requirements. Do not disable OS security protections.

            Desktop: Linux AppImage/deb, Windows exe/msi, macOS architecture-specific dmg.
            CLI: platform archives include km and bundled suites. Python wheel also included.
            SHA256SUMS.txt provides file integrity checks, not publisher authentication.
            Native offline unit and CLI/engine smoke tests run before publication.
            GUI installation and first launch on a user's machine are separate validation steps.

            Unvalidated pilot. Not a ranking.
