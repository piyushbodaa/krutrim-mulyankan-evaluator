# Pushing a tag v<version> publishes download assets. The tag version must match
# pyproject.toml (v0.1.0 -> kritrim_mulyankan-0.1.0-py3-none-any.whl).
# This file does not create tags. Assets are unsigned; see desktop/SIGNING.md.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Check version, lint, and test
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$tag" = "$ver"
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest

  wheel:
    name: Python wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          ver="${GITHUB_REF_NAME#v}"
          uv build --wheel
          test -f "dist/kritrim_mulyankan-${ver}-py3-none-any.whl"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          if-no-files-found: error
          path: dist/kritrim_mulyankan-*.whl

  cli:
    name: Linux km binary
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build single-file km with suites packed in
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install .
          python -m PyInstaller --noconfirm --clean --onefile --name km \
            --collect-all kritrim_mulyankan \
            --add-data "suites:suites" \
            desktop/sidecar/km_entry.py
          mkdir -p dist/km-linux/suites
          cp dist/km dist/km-linux/km
          chmod +x dist/km-linux/km
          cp -a suites/. dist/km-linux/suites/
          tar -C dist/km-linux -czf km-linux-x86_64.tar.gz km suites
      - uses: actions/upload-artifact@v4
        with:
          name: km-linux
          if-no-files-found: error
          path: km-linux-x86_64.tar.gz

  desktop:
    name: Desktop ${{ matrix.asset }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage
            asset: Krutrim-Mulyankan-linux.AppImage
            glob: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            bundles: nsis
            asset: Krutrim-Mulyankan-windows.exe
            glob: desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundles: dmg
            asset: Krutrim-Mulyankan-mac.dmg
            glob: desktop/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config
      - name: Bundle the Python engine
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install .
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; else SEP=":"; fi
          python -m PyInstaller --noconfirm --clean --onefile --name km-desktop \
            --collect-all kritrim_mulyankan \
            --add-data "suites${SEP}suites" \
            --add-data "preview${SEP}preview" \
            --add-data "desktop/ui/dashboard-shim.js${SEP}desktop/ui" \
            desktop/sidecar/entry.py
          mkdir -p desktop/src-tauri/resources/engine
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/km-desktop.exe desktop/src-tauri/resources/engine/km-desktop.exe
          else
            cp dist/km-desktop desktop/src-tauri/resources/engine/km-desktop
            chmod +x desktop/src-tauri/resources/engine/km-desktop
          fi
      - name: Build the unsigned installer
        working-directory: desktop
        shell: bash
        run: |
          npm install
          npm run build -- --bundles ${{ matrix.bundles }}
      - name: Rename to the download filename
        shell: bash
        run: |
          built=$(echo ${{ matrix.glob }})
          test -f "$built"
          cp "$built" "${{ matrix.asset }}"
          if [ "${{ matrix.asset }}" = "Krutrim-Mulyankan-linux.AppImage" ]; then
            chmod +x "${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          if-no-files-found: error
          path: ${{ matrix.asset }}

  publish:
    name: GitHub Release
    needs: [wheel, cli, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Require the website filenames
        run: |
          ver="${GITHUB_REF_NAME#v}"
          test -f release/Krutrim-Mulyankan-linux.AppImage
          test -f release/Krutrim-Mulyankan-windows.exe
          test -f release/Krutrim-Mulyankan-mac.dmg
          test -f "release/kritrim_mulyankan-${ver}-py3-none-any.whl"
          test -f release/km-linux-x86_64.tar.gz
          find release -type f -printf '%f\n' | sort > /tmp/release-names.txt
          cat /tmp/release-names.txt
          test "$(wc -l < /tmp/release-names.txt)" -eq 5
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/Krutrim-Mulyankan-linux.AppImage
            release/Krutrim-Mulyankan-windows.exe
            release/Krutrim-Mulyankan-mac.dmg
            release/kritrim_mulyankan-*.whl
            release/km-linux-x86_64.tar.gz
          body: |
            Unsigned builds. Signing is a later step.

            Desktop, no terminal required:
            - Krutrim-Mulyankan-linux.AppImage
            - Krutrim-Mulyankan-windows.exe
            - Krutrim-Mulyankan-mac.dmg

            Command line:
            - kritrim_mulyankan-<version>-py3-none-any.whl
            - km-linux-x86_64.tar.gz — single-file `km`, with `suites/` beside it and packed inside

            Unvalidated pilot. Not a ranking.
