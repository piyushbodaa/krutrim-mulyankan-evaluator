# Desktop CI and tagged releases call exactly the same build and smoke tests.
name: Build downloads

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            cli-target: x86_64-unknown-linux-musl
            desktop-target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - platform: windows-x86_64
            os: windows-2022
            cli-target: x86_64-pc-windows-msvc
            desktop-target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-aarch64
            os: macos-15
            cli-target: aarch64-apple-darwin
            desktop-target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos-x86_64
            os: macos-15-intel
            cli-target: x86_64-apple-darwin
            desktop-target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cli-target }},${{ matrix.desktop-target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config
      - name: Rust tests on the native platform
        run: cargo test --locked --manifest-path km-rs/Cargo.toml --target "${{ matrix.desktop-target }}"
      - name: Build the CLI and desktop engine
        run: |
          cargo build --locked --release --manifest-path km-rs/Cargo.toml -p km-cli --target "${{ matrix.cli-target }}"
          cargo build --locked --release --manifest-path km-rs/Cargo.toml -p km-desktop-engine --target "${{ matrix.desktop-target }}"
          python scripts/package_downloads.py stage-engine --target "${{ matrix.desktop-target }}"
          python scripts/package_downloads.py package-cli --target "${{ matrix.cli-target }}" --platform "${{ matrix.platform }}"
      - name: Ad-hoc sign the bundled macOS engine
        if: runner.os == 'macOS'
        run: codesign --force --sign - desktop/src-tauri/resources/engine/km-desktop
      - name: Verify the staged engine from an empty working directory
        run: python scripts/package_downloads.py smoke-engine --root desktop/src-tauri/resources/engine
      - name: Build the desktop installer
        working-directory: desktop
        run: |
          npm ci
          npm run build -- --ci --target "${{ matrix.desktop-target }}" --bundles "${{ matrix.bundles }}" -- --locked
      - name: Verify the packaged engine and prepare downloads
        run: python scripts/package_downloads.py package-desktop --target "${{ matrix.desktop-target }}" --platform "${{ matrix.platform }}"
      - name: Upload tested downloads
        uses: actions/upload-artifact@v4
        with:
          name: downloads-${{ matrix.platform }}
          path: dist/downloads/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
