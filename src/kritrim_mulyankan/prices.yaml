# Bundled model prices, in USD per million tokens. Override or extend them in ./prices.yaml (or
# the file named by MJ_PRICES), using the same format; entries there win.
#
# A paid model with no price here is refused before any call, so the budget cap always holds.
# Only prices with a checked source are bundled. Add OpenAI, Gemini, xAI and OpenRouter models
# yourself from the provider's pricing page.
#
# Per model: input, output, and optionally cache_read, cache_write (default: input, and
# 1.25 x input), plus long_context_threshold / long_input / long_output for prompt-size tiers.

anthropic:
  source: https://platform.claude.com/docs/en/about-claude/pricing
  as_of: "2026-10-06"
  models:
    claude-fable-5-1: {input: 10.00, output: 50.00, cache_read: 0.25}
    claude-fable-5: {input: 10.00, output: 50.00}
    claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20}
    claude-opus-5: {input: 5.00, output: 25.00}
    claude-opus-4-8: {input: 5.00, output: 25.00}
    claude-opus-4-7: {input: 5.00, output: 25.00}
    claude-opus-4-6: {input: 5.00, output: 25.00}
    claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20}
    claude-sonnet-5: {input: 2.00, output: 10.00}
    claude-sonnet-4-6: {input: 3.00, output: 15.00}
    claude-haiku-5-5:
      {input: 0.10, output: 0.50, long_context_threshold: 100000, long_input: 0.50, long_output: 2.50}
    claude-haiku-4-5: {input: 1.00, output: 5.00}

ollama:
  source: local inference, no API charges
  as_of: "2026-10-12"
  models:
    "*": {input: 0, output: 0}

vllm:
  source: self-hosted inference, API charges only; excludes hardware and electricity
  as_of: "2026-10-12"
  models:
    "*": {input: 0, output: 0}
