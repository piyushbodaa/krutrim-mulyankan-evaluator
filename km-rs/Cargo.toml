[workspace]
resolver = "2"
members = ["crates/evaluator", "crates/km", "crates/km-desktop"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"

# Small, static release binaries. `strip` plus fat LTO is worth ~30% here.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
