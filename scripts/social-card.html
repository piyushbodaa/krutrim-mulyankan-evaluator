<!doctype html>
<!-- Evaluator social-sharing card, 1200×630, in the layout of krutrimmulyankan.in's card.
     Places the approved kit lockup (preview/brand/km-chakra-wordmark.svg) unmodified — nothing is redrawn —
     beside Sora text. Regenerate by rendering this file at a 1200×630 viewport in any headless browser and
     saving the screenshot to preview/brand/social-card.png. -->
<html lang="en-IN">
<head>
<meta charset="utf-8">
<title>Krutrim Mulyankan Evaluator social card</title>
<style>
@font-face{font-family:"Sora";src:url("../preview/brand/fonts/Sora.woff2") format("woff2");font-weight:100 800}
html,body{margin:0}
body{position:relative;width:1200px;height:630px;overflow:hidden;background:#FFFFFF;color:#171717;font-family:"Sora",sans-serif}
/* The lockup has 11.83 viewBox units of space left of the ring; offset so the ring aligns with the text. */
.lockup{position:absolute;top:64px;left:calc(96px - 700px * 11.83 / 420);width:700px;height:auto}
h1{position:absolute;left:96px;top:382px;margin:0;font-size:68px;line-height:1;font-weight:600;letter-spacing:-.035em}
p{position:absolute;left:96px;top:478px;margin:0;font-size:27px;line-height:1.3;color:#5F6065}
</style>
</head>
<body>
<img class="lockup" src="../preview/brand/km-chakra-wordmark.svg" width="420" height="143" alt="Krutrim Mulyankan — कृत्रिम मूल्यांकन">
<h1>Evaluator</h1>
<p>Unvalidated pilot results · Not a ranking</p>
</body>
</html>
